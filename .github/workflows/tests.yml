name: tests
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[apps,dev]"
      - run: python -m unittest discover -s tests -v
      - run: ruff check .
      - run: ruff format --check .
      - name: Test the read-only Windows network checker
        if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/test_network_check.ps1
      - name: Test Windows setup with mocked UAC and adapter changes
        if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/test_network_setup.ps1
      - run: python -m build

  webusb:
    name: WebUSB web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webusb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - name: End-to-end test in Google Chrome with a simulated headset
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.1
          CHROME_PATH="$(command -v google-chrome)" node tests/e2e/live-view.e2e.mjs

  build-artifacts:
    name: Build application artifacts
    needs: test
    uses: ./.github/workflows/build.yml
